---
- name: Install dante-server package
  ansible.builtin.apt:
    name: dante-server
    update_cache: true
  tags: [Install]

- name: Add Dante systemd unit
  ansible.builtin.template:
    src: danted.service.j2
    dest: "{{ dante_systemd_unit }}"
    group: root
    owner: root
    mode: "644"
  tags: [Install]

- name: Create log directory
  ansible.builtin.file:
    path: "{{ dante_logs }}"
    state: directory
    group: root
    owner: root
    mode: "0755"
  tags: [Install]

- name: Add config
  ansible.builtin.template:
    src: danted.conf.j2
    dest: "{{ dante_config }}"
    group: root
    owner: root
    mode: "0644"
  notify:
    - Restart dante
  tags: [Configure]

- name: Enable dante systemd service
  ansible.builtin.systemd:
    name: danted.service
    state: started
    enabled: true
    masked: false
    daemon_reload: true
  tags: [Configure]
